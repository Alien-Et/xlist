name: 构建并发布 APK

# 显式设置所需权限
permissions:
  contents: write  # 允许创建 tag 和 Release

on:
  push:
    branches: [main]
  workflow_dispatch: # 也可手动触发

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      # 检出仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 设置 JDK 17（Flutter/AGP 8.11 需要）
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 设置 Flutter 环境（与本地验证版本一致）
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: 'stable'
          cache: true

      # 获取依赖
      - name: Install dependencies
        run: flutter pub get

      # 生成 release 签名密钥（密钥密码优先取 Secrets，未配置时用 CI 默认值）
      - name: Generate release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          PASS="${KEYSTORE_PASSWORD:-xlist-ci-2026}"
          keytool -genkey -v \
            -keystore "$RUNNER_TEMP/release-key.jks" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias xlist -storepass "$PASS" -keypass "$PASS" \
            -dname "CN=XList, OU=Dev, O=XList, L=City, S=State, C=CN" 2>/dev/null
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/release-key.jks
          storePassword=$PASS
          keyAlias=xlist
          keyPassword=$PASS
          EOF
          echo "keystore generated (alias: xlist)"

      # 构建正式版 APK（release，已签名）
      - name: Build release APK
        run: flutter build apk --release

      # 构建调试版 APK（debug）
      - name: Build debug APK
        run: flutter build apk --debug

      # 生成递增的发布版本号（v1.0.0 → v1.0.1 → ...）
      - name: Generate incremental version tag
        id: version
        run: |
          LATEST_TAG=$(git tag -l 'v1.*' | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.0"
          else
            VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            MINOR=$(echo "$VERSION" | cut -d. -f2)
            PATCH=$(echo "$VERSION" | cut -d. -f3)
            PATCH=$((PATCH + 1))
            NEW_TAG="v$MAJOR.$MINOR.$PATCH"
          fi
          echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"
          echo "Generated version: $NEW_TAG"

      # 上传两个 APK 作为 workflow artifact（可在 Actions 页面直接下载）
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xlist-apks-${{ env.NEW_TAG }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      # 创建 GitHub Release 并同时挂载两个 APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_TAG }}
          name: Release ${{ env.NEW_TAG }}
          body: |
            ## XList 自动构建发布

            - **app-release.apk**：正式发布版（已签名，可直接安装）
            - **app-debug.apk**：调试版（含调试日志，供排查问题）

            来源提交：`${{ github.sha }}`
            构建时间：${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-debug.apk
